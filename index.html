<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriAção - MVP Front-End</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f1e3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #2f5d27;
            color: #ffffff;
            text-align: center;
            padding: 2rem 1rem;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        section {
            background-color: #dcdacd;
            width: 100%;
            max-width: 28rem;
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
        }
        h2 { margin-bottom: 0.8rem; color: #1f1f1f; }
        p { margin-bottom: 1.5rem; color: #333; font-size: 0.95rem; }
        a {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background-color: #2f5d27;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 1rem;
        }
        a:last-child { margin-bottom: 0; }
        a:hover { background-color: #244a1f; }
    </style>
</head>
<body>
    <header>
        <h1>NutriAção - Projeto Integrador</h1>
    </header>
    <main>
        <section>
            <h2>Protótipo Navegável (MVP)</h2>
            <p>Selecione uma das interfaces desenvolvidas para visualizar:</p>
            <a href="03-front-end/nutriAcao-FICR-main/html/cadastro.html">1. Cadastro de Instituição Parceira (ONG)</a>
            <a href="03-front-end/nutriAcao-FICR-main/html/funcionario.html">2. Painel do Funcionário (RSVP e Cardápio)</a>
        </section>
    </main>
</body>
</html>
