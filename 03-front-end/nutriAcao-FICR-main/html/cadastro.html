<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - NutriAção</title>
    <link rel="stylesheet" href="/css/cadastro.css">
   
</head>
<body>
    
    <header> <h1>NutriAção - Cadastro</h1></header> 

    <main> 
        <section>
            <h2>Cadastro de instituição Parceira (ONG)</h2> 

            <form action="#" method="post">

                <label for="cnpj">CNPJ</label> 
                

                <input 
                type="text" 
                id="cnpj" 
                name="cnpj" 
                placeholder="00.000.000/0001-00" 
                maxlength="18"
                
                required>
                
                <label for="nome">Nome da ONG</label>
                <input type="text" id="nome" name="nome" placeholder="Mesa Solidária" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="contato@mesasolidaria.org" required>
                
                <button type="submit">Enviar Para Aprovação</button>
                

            </form>

        </section>
    </main>



</body>
</html>
